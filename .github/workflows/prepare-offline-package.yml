name: Prepare Offline Package for Ubuntu 22.04

on:
  workflow_dispatch: # Allows you to manually trigger this workflow from the GitHub Actions tab

jobs:
  build-offline-package:
    runs-on: ubuntu-22.04 # Uses an Ubuntu 22.04 runner to match your offline system
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create package directory
        run: |
          mkdir -p offline-ragflow-packages/ubuntu22-packages
          mkdir -p offline-ragflow-packages/python-packages
          cd offline-ragflow-packages

      - name: Download gVisor
        run: |
          cd offline-ragflow-packages
          ARCH=x86_64
          URL=https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}
          wget ${URL}/gvisor.tar.bz2 ${URL}/gvisor.tar.bz2.sha512
          sha512sum -c gvisor.tar.bz2.sha512
          mkdir -p gvisor
          tar -xjf gvisor.tar.bz2 -C gvisor
          chmod +x gvisor/runsc gvisor/containerd-shim-runsc-v1

      - name: Download Ubuntu 22.04 .deb packages
        run: |
          cd offline-ragflow-packages/ubuntu22-packages
          for pkg in runc containerd docker.io libseccomp2 libsystemd0; do
            apt-get download $pkg
          done

      - name: Create requirements file and download Python packages
        run: |
          cd offline-ragflow-packages
          echo -e "fastapi\nuvicorn\nslowapi\npillow==12.0.0\nopencv-python-headless==4.12.0.88" > requirements.txt
          pip3 download -r requirements.txt -d ./python-packages

      - name: Create installation script
        run: |
          cd offline-ragflow-packages
          cat > install.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          echo "Installing gVisor..."
          sudo install -Dm755 "${SCRIPT_DIR}/gvisor/runsc" /usr/local/bin/runsc
          sudo install -Dm755 "${SCRIPT_DIR}/gvisor/containerd-shim-runsc-v1" /usr/local/bin/containerd-shim-runsc-v1
          if [ -d "${SCRIPT_DIR}/gvisor/gvisor-bin" ]; then
            sudo mkdir -p /usr/local/bin/gvisor-bin
            sudo cp -r "${SCRIPT_DIR}/gvisor/gvisor-bin/." /usr/local/bin/gvisor-bin/
          fi
          sudo /usr/local/bin/runsc install

          echo "Installing Docker packages..."
          cd "${SCRIPT_DIR}/ubuntu22-packages"
          sudo dpkg -i ./*.deb || true
          sudo apt-get install -f -y

          echo "Configuring Docker..."
          sudo mkdir -p /etc/docker
          sudo tee /etc/docker/daemon.json > /dev/null <<'EOL'
          {
            "runtimes": {
              "runsc": {
                "path": "/usr/local/bin/runsc"
              }
            }
          }
          EOL
          sudo systemctl enable docker
          sudo systemctl restart docker

          echo "Installing Python packages..."
          python3 -m pip install --no-index --find-links="${SCRIPT_DIR}/python-packages" -r "${SCRIPT_DIR}/requirements.txt"

          echo "Installation complete!"
          EOF
          chmod +x install.sh

      - name: Package all files into a zip
        run: |
          zip -r ragflow-offline-packages.zip offline-ragflow-packages/

      - name: Upload package as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ragflow-offline-packages
          path: ragflow-offline-packages.zip
