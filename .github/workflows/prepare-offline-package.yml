name: Prepare Offline Package for Ubuntu 22.04

on:
  workflow_dispatch:

jobs:
  build-offline-package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create package directory
        run: |
          mkdir -p offline-ragflow-packages/ubuntu22-packages
          mkdir -p offline-ragflow-packages/python-packages

      - name: Download gVisor
        run: |
          cd offline-ragflow-packages
          # Download the GPG key
          wget https://gvisor.dev/archive.key
          
          # Download runsc - using the correct URL structure
          # Get the latest release version
          LATEST_VERSION=$(curl -s https://api.github.com/repos/google/gvisor/releases/latest | grep tag_name | cut -d '"' -f 4)
          wget https://storage.googleapis.com/gvisor/releases/release/${LATEST_VERSION}/amd64/runsc
          chmod +x runsc

      - name: Download Ubuntu 22.04 .deb packages
        run: |
          cd offline-ragflow-packages/ubuntu22-packages
          # Download Docker and its dependencies for Ubuntu 22.04
          apt-get update
          apt-get download docker.io
          apt-get download containerd
          apt-get download runc
          apt-get download libseccomp2
          apt-get download libsystemd0
          # Also download docker-compose-plugin if needed
          apt-get download docker-compose-plugin

      - name: Create requirements file and download Python packages
        run: |
          cd offline-ragflow-packages
          cat > requirements.txt <<EOF
          fastapi
          uvicorn
          slowapi
          pillow==12.0.0
          opencv-python-headless==4.12.0.88
          EOF
          pip3 download -r requirements.txt -d ./python-packages

      - name: Create installation script
        run: |
          cd offline-ragflow-packages
          cat > install.sh <<'EOF'
          #!/bin/bash
          echo "Installing gVisor..."
          sudo gpg --dearmor -o /usr/share/keyrings/gvisor.gpg < archive.key
          sudo cp runsc /usr/local/bin/
          sudo chmod +x /usr/local/bin/runsc
          
          echo "Installing Docker packages..."
          cd ubuntu22-packages
          sudo dpkg -i *.deb
          sudo apt-get install -f -y
          
          echo "Configuring Docker..."
          sudo tee /etc/docker/daemon.json <<EOL
          {
            "runtimes": {
              "runsc": {
                "path": "/usr/local/bin/runsc"
              }
            }
          }
          EOL
          sudo systemctl restart docker
          
          echo "Installing Python packages..."
          cd ../python-packages
          pip3 install --no-index --find-links=. -r ../requirements.txt
          
          echo "Installation complete!"
          EOF
          chmod +x install.sh

      - name: Package all files into a zip
        run: |
          zip -r ragflow-offline-packages.zip offline-ragflow-packages/

      - name: Upload package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragflow-offline-packages
          path: ragflow-offline-packages.zip
